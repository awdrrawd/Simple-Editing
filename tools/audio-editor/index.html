<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聲音編輯器 · 純瀏覽器工具</title>
<script src="../../assets/shared.js"></script>
<style>
  :root{ --radius:10px; }
  html[data-theme="light"]{
    --bg:#ffffff; --bg-inset:#f6f8fa; --bg-hover:#eef1f4;
    --border:#d0d7de; --text:#1f2328; --text-secondary:#656d76;
    --accent:#0969da; --accent-soft:#ddf4ff; --accent-text:#ffffff;
    --shadow:0 1px 2px rgba(0,0,0,0.05);
  }
  html[data-theme="dark"]{
    --bg:#0d1117; --bg-inset:#161b22; --bg-hover:#21262d;
    --border:#30363d; --text:#e6edf3; --text-secondary:#8b949e;
    --accent:#58a6ff; --accent-soft:#132f4c; --accent-text:#0d1117;
    --shadow:0 1px 2px rgba(0,0,0,0.3);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Helvetica,Arial,sans-serif;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:14px 24px; flex-wrap:wrap;
    border-bottom:1px solid var(--border);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:32px; height:32px; border-radius:8px;
    background:var(--accent); color:var(--accent-text);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  }
  h1{ font-size:1.05rem; margin:0; }
  .btn{
    appearance:none; border:1px solid var(--border); background:var(--bg-inset);
    color:var(--text); border-radius:8px; padding:7px 12px; font-size:.82rem;
    font-weight:600; cursor:pointer; font-family:inherit;
  }
  .btn:hover{ background:var(--bg-hover); }
  .controls{ display:flex; gap:8px; }

  main{ max-width:960px; margin:0 auto; padding:40px 24px 64px; }
  .track{ border:1px solid var(--border); border-radius:var(--radius); background:var(--bg-inset); padding:12px; margin-bottom:16px; }
  .track-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .track-title{ font-weight:600; }
  .track-controls{ display:flex; gap:8px; align-items:center; }
  .slider-group{ display:flex; flex-direction:column; gap:4px; }
  .slider-group label{ font-size:.82rem; color:var(--text-secondary); }
  input[type=range]{ width:120px; }
  .btn-row{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btn.primary{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  .btn.primary:hover{ background:var(--accent-hover); }
  .btn.ghost{ background:transparent; }
  .hint{ font-size:.88rem; color:var(--text-secondary); margin-top:8px; }
  .waveform{ height:60px; background:var(--bg); border:1px solid var(--border); border-radius:4px; margin-top:8px; position:relative; overflow:hidden; }
  .waveform canvas{ display:block; width:100%; height:100%; }
  .progress-bar{ height:4px; background:var(--bg-inset); border-radius:2px; margin-top:8px; overflow:hidden; }
  .progress-bar div{ height:100%; width:0%; background:var(--accent); transition:width .1s linear; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">SE</div>
    <h1 data-i18n="toolTitle">聲音編輯器</h1>
  </div>
  <div class="controls">
    <button class="btn" id="themeToggle" data-i18n="themeBtn">🌓 主題</button>
    <button class="btn" id="localeToggle" data-i18n="localeBtn">🌐 語系</button>
    <a href="../../index.html" class="btn" data-se-home></a>
  </div>
</div>

<main>
  <section>
    <h2 data-i18n="loadTitle">載入音訊</h2>
    <div class="input-group">
      <label for="audioFiles" data-i18n="labelFiles">選取音訊檔案（可多選）</label>
      <input type="file" id="audioFiles" accept="audio/*" multiple>
    </div>
    <button class="btn primary" id="btnLoad" data-i18n="btnLoad">載入音訊</button>
    <p class="hint" id="hintLoad" data-i18n="hintLoad">支援常見格式如 MP3、WAV、OGG。載入後會顯示波形與調整滑桿。</p>
  </section>

  <section id="tracksContainer"></section>

  <section>
    <button class="btn primary" id="btnPlayAll" data-i18n="btnPlayAll">播放全部</button>
    <button class="btn" id="btnStopAll" data-i18n="btnStopAll">停止全部</button>
    <div class="progress-bar" id="globalProgress"><div></div></div>
    <p class="hint" id="hintPlayback" data-i18n="hintPlayback">播放時會混合所有軌道。調整音量與音高會即時影響混合結果。</p>
  </section>
</main>

<script>
(function(){
  const root = document.documentElement;
  const I18N = {
    zh: {
      toolTitle:'聲音編輯器 · 純瀏覽器工具',
      themeBtn:'🌓 主題', localeBtn:'🌐 語系',
      loadTitle:'載入音訊',
      labelFiles:'選取音訊檔案（可多選）',
      btnLoad:'載入音訊',
      hintLoad:'支援常見格式如 MP3、WAV、OGG。載入後會顯示波形與調整滑桿。',
      btnPlayAll:'播放全部',
      btnStopAll:'停止全部',
      hintPlayback:'播放時會混合所有軌道。調整音量與音高會即時影響混合結果。',
      trackTitle:'軌道',
      btnRemove:'移除',
      btnPlay:'播放',
      btnPause:'暫停',
      sliderVolume:'音量',
      sliderPitch:'音高（會影響速度）',
      btnDownloadMix:'下載混合音訊'
    },
    en: {
      toolTitle:'Audio Editor · Browser-only tool',
      themeBtn:'🌓 Theme', localeBtn:'🌐 Language',
      loadTitle:'Load Audio',
      labelFiles:'Select audio files (multiple)',
      btnLoad:'Load Audio',
      hintLoad:'Supports common formats like MP3, WAV, OGG. After loading, waveforms and sliders will appear.',
      btnPlayAll:'Play All',
      btnStopAll:'Stop All',
      hintPlayback:'Playback mixes all tracks. Adjusting volume and pitch will affect the mixed output in real time.',
      trackTitle:'Track',
      btnRemove:'Remove',
      btnPlay:'Play',
      btnPause:'Pause',
      sliderVolume:'Volume',
      sliderPitch:'Pitch (affects speed)',
      btnDownloadMix:'Download Mixed Audio'
    }
  };

  let lang = SharedSettings.getLang();

  function applyLocale(){
    const dict = I18N[lang];
    root.setAttribute('lang', lang === 'zh' ? 'zh-Hant' : 'en');
    document.title = lang === 'zh' ? '聲音編輯器 · 純瀏覽器工具' : 'Audio Editor · Browser-only tool';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      if(dict[key] !== undefined) el.textContent = dict[key];
    });
  }
  applyLocale();
  document.getElementById('localeToggle').addEventListener('click', () => {
    lang = lang === 'zh' ? 'en' : 'zh';
    SharedSettings.setLang(lang);
    applyLocale();
  });

  // ---- theme ----
  let userOverride = SharedSettings.hasExplicitTheme();
  function applyTheme(theme){ root.setAttribute('data-theme', theme); }
  applyTheme(SharedSettings.getTheme());
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if(!userOverride) applyTheme(e.matches ? 'dark' : 'light');
  });
  document.getElementById('themeToggle').addEventListener('click', () => {
    userOverride = true;
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    SharedSettings.setTheme(next);
    applyTheme(next);
  });

  const audioFilesInput = document.getElementById('audioFiles');
  const btnLoad = document.getElementById('btnLoad');
  const hintLoad = document.getElementById('hintLoad');
  const tracksContainer = document.getElementById('tracksContainer');
  const btnPlayAll = document.getElementById('btnPlayAll');
  const btnStopAll = document.getElementById('btnStopAll');
  const globalProgress = document.getElementById('globalProgress');
  const progressBar = globalProgress.querySelector('div');
  const hintPlayback = document.getElementById('hintPlayback');

  let audioContext = null;
  const tracks = []; // each track: {file, buffer, sourceNodes: [], gainNode, pitchNode?, waveformCanvas, progressBar, playing: false}
  let mixerGain = null;

  function initAudioContext(){
    if(!audioContext){
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      mixerGain = audioContext.createGain();
      mixerGain.connect(audioContext.destination);
    }
    return audioContext;
  }

  function decodeAudio(arrayBuffer){
    return audioContext.decodeAudioData(arrayBuffer);
  }

  function createWaveform(buffer, container){
    const canvas = document.createElement('canvas');
    canvas.width = container.clientWidth || 200;
    canvas.height = 40;
    const ctx = canvas.getContext('2d');
    const channelData = buffer.getChannelData(0); // mono for simplicity
    const step = Math.ceil(channelData.length / canvas.width);
    const amp = canvas.height / 2;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'var(--accent)';
    ctx.beginPath();
    for(let i=0; i<canvas.width; i++){
      const sample = channelData[i*step];
      const y = amp + sample * amp;
      if(i===0) ctx.moveTo(i, y);
      else ctx.lineTo(i, y);
    }
    ctx.stroke();
    container.appendChild(canvas);
    return canvas;
  }

  function updateProgressBar(trackElement, progress){
    const bar = trackElement.querySelector('.progress-bar div');
    if(bar) bar.style.width = (progress*100) + '%';
  }

  function updateGlobalProgress(){
    if(tracks.length===0){ progressBar.style.width = '0%'; return; }
    const avg = tracks.reduce((sum, t)=> sum + (t.playing ? t.position : 0), 0) / tracks.length;
    progressBar.style.width = (avg*100) + '%';
  }

  btnLoad.addEventListener('click', async () => {
    const files = audioFilesInput.files;
    if(files.length===0){
      alert(lang === 'zh' ? '請選取至少一個音訊檔案' : 'Please select at least one audio file');
      return;
    }
    hintLoad.textContent = lang === 'zh' ? '載入中...' : 'Loading...';
    btnLoad.disabled = true;
    try{
      const ctx = initAudioContext();
      for(const file of files){
        const arrayBuffer = await file.arrayBuffer();
        const buffer = await decodeAudio(arrayBuffer);
        const trackEl = document.createElement('div');
        trackEl.className = 'track';
        trackEl.dataset.name = file.name;
        trackEl.innerHTML = `
          <div class="track-header">
            <div class="track-title" data-i18n="trackTitle">軌道</div>: <span>${file.name}</span>
            <div class="track-controls">
              <button class="btn" data-action="play" data-i18n="btnPlay">播放</button>
              <button class="btn" data-action="pause" data-i18n="btnPause">暫停</button>
              <button class="btn" data-action="remove" data-i18n="btnRemove">移除</button>
            </div>
          </div>
          <div class="slider-group">
            <label data-i18n="sliderVolume">音量</label>
            <input type="range" min="0" max="1" step="0.01" value="1">
          </div>
          <div class="slider-group">
            <label data-i18n="sliderPitch">音高（會影響速度）</label>
            <input type="range" min="0.5" max="2" step="0.01" value="1">
          </div>
          <div class="waveform"></div>
          <div class="progress-bar"><div></div></div>
          <button class="btn primary" data-action="download" data-i18n="btnDownloadMix">下載混合音訊</button>
        `;
        // Apply locale to newly added elements
        const dict = I18N[lang];
        trackEl.querySelectorAll('[data-i18n]').forEach(el=>{
          const key = el.dataset.i18n;
          if(dict[key]!==undefined){
            if(el.tagName==='BUTTON'||el.tagName==='LABEL'){
              el.textContent = dict[key];
            }else if(el.tagName==='SPAN'&&el.parentElement && el.parentElement.classList.contains('track-title')){
              // track title span is after the label; we keep filename separate
            }else{
              el.textContent = dict[key];
            }
          }
        });
        const waveformContainer = trackEl.querySelector('.waveform');
        const waveformCanvas = createWaveform(buffer, waveformContainer);
        const volumeSlider = trackEl.querySelector('.slider-group input[min="0"][max="1"]');
        const pitchSlider = trackEl.querySelector('.slider-group input[min="0.5"][max="2"]');
        const playBtn = trackEl.querySelector('[data-action="play"]');
        const pauseBtn = trackEl.querySelector('[data-action="pause"]');
        const removeBtn = trackEl.querySelector('[data-action="remove"]');
        const downloadBtn = trackEl.querySelector('[data-action="download"]');
        const progressBarEl = trackEl.querySelector('.progress-bar div');

        const gainNode = ctx.createGain();
        gainNode.connect(mixerGain);
        const trackObj = {
          file,
          buffer,
          gainNode,
          volumeSlider,
          pitchSlider,
          playBtn,
          pauseBtn,
          removeBtn,
          downloadBtn,
          waveformCanvas,
          progressBar: progressBarEl,
          sourceNodes: [],
          playing: false,
          position: 0,
          startTime: 0,
          offset: 0
        };
        tracks.push(trackObj);
        trackEl._trackObj = trackObj;
        tracksContainer.appendChild(trackEl);

        // Volume
        volumeSlider.addEventListener('input', () => {
          gainNode.gain.setValueAtTime(volumeSlider.value, audioContext.currentTime);
        });
        // Pitch (playbackRate)
        pitchSlider.addEventListener('input', () => {
          // Update all active source nodes' playbackRate
          trackObj.sourceNodes.forEach(src=>{
            src.playbackRate.setValueAtTime(pitchSlider.value, audioContext.currentTime);
          });
        });
        // Play
        playBtn.addEventListener('click', () => {
          if(trackObj.playing) return;
          const source = ctx.createBufferSource();
          source.buffer = trackObj.buffer;
          source.playbackRate.setValueAtTime(pitchSlider.value, audioContext.currentTime);
          source.connect(trackObj.gainNode);
          source.start(0, trackObj.offset);
          trackObj.sourceNodes.push(source);
          trackObj.playing = true;
          trackObj.startTime = audioContext.currentTime;
          playBtn.disabled = true;
          pauseBtn.disabled = false;
        });
        // Pause
        pauseBtn.addEventListener('click', () => {
          if(!trackObj.playing) return;
          trackObj.sourceNodes.forEach(src=> src.stop(audioContext.currentTime));
          trackObj.sourceNodes = [];
          const elapsed = audioContext.currentTime - trackObj.startTime;
          trackObj.position = (trackObj.position + elapsed * pitchSlider.value) / trackObj.buffer.duration;
          if(trackObj.position >= 1) trackObj.position = 0;
          trackObj.playing = false;
          playBtn.disabled = false;
          pauseBtn.disabled = true;
        });
        // Remove
        removeBtn.addEventListener('click', () => {
          // Stop any playing sources
          trackObj.sourceNodes.forEach(src=> src.stop(audioContext.currentTime));
          trackObj.sourceNodes = [];
          // Remove from tracks array
          const idx = tracks.indexOf(trackObj);
          if(idx>-1) tracks.splice(idx,1);
          trackEl.remove();
          // If no tracks left, disable global play/stop
          if(tracks.length===0){
            btnPlayAll.disabled = true;
            btnStopAll.disabled = true;
          }
        });
        // Download mixed audio (will be handled globally)
        downloadBtn.addEventListener('click', () => {
          // We'll implement global download after mixing
          alert(lang === 'zh' ? '請使用「下載混合音訊」按鈕以下載所有軌道混合後的音訊' : 'Please use the "Download Mixed Audio" button to download the mixed result of all tracks');
        });

        // Update progress bar periodically if playing
        // We'll handle via a global animation frame
      }
      hintLoad.textContent = lang === 'zh' ? `已載入 ${files.length} 個檔案` : `Loaded ${files.length} files`;
      btnLoad.disabled = false;
      btnPlayAll.disabled = false;
      btnStopAll.disabled = false;
    }catch(err){
      console.error(err);
      hintLoad.textContent = lang === 'zh' ? '載入失敗：' + err.message : 'Load failed: ' + err.message;
      btnLoad.disabled = false;
    }
  });

  // Global play/pause
  btnPlayAll.addEventListener('click', () => {
    tracks.forEach(t=> {
      if(!t.playing){
        const source = audioContext.createBufferSource();
        source.buffer = t.buffer;
        source.playbackRate.setValueAtTime(t.pitchSlider.value, audioContext.currentTime);
        source.connect(t.gainNode);
        source.start(0, t.offset);
        t.sourceNodes.push(source);
        t.playing = true;
        t.startTime = audioContext.currentTime;
        t.playBtn.disabled = true;
        t.pauseBtn.disabled = false;
      }
    });
    btnPlayAll.disabled = true;
    btnStopAll.disabled = false;
  });

  btnStopAll.addEventListener('click', () => {
    tracks.forEach(t=>{
      t.sourceNodes.forEach(src=> src.stop(audioContext.currentTime));
      t.sourceNodes = [];
      const elapsed = audioContext.currentTime - t.startTime;
      t.position = (t.position + elapsed * t.pitchSlider.value) / t.buffer.duration;
      if(t.position >= 1) t.position = 0;
      t.playing = false;
      t.playBtn.disabled = false;
      t.pauseBtn.disabled = true;
    });
    btnPlayAll.disabled = false;
    btnStopAll.disabled = true;
  });

  // Animation loop to update progress bars
  function update(){
    if(audioContext){
      tracks.forEach(t=>{
        if(t.playing && t.sourceNodes.length>0){
          const elapsed = audioContext.currentTime - t.startTime;
          t.position = (t.offset + elapsed * t.pitchSlider.value) / t.buffer.duration;
          if(t.position >= 1){
            // loop or stop? we'll stop at end
            t.sourceNodes.forEach(src=> src.stop(audioContext.currentTime));
            t.sourceNodes = [];
            t.playing = false;
            t.position = 0;
            t.playBtn.disabled = false;
            t.pauseBtn.disabled = true;
          }else{
            updateProgressBar(t.trackEl ? t.trackEl : document.querySelector(`[data-name="${t.file.name}"] .progress-bar div`), t.position);
          }
        }
      });
      updateGlobalProgress();
    }
    requestAnimationFrame(update);
  }
  requestAnimationFrame(update);

  // Global download of mixed audio (render to buffer)
  // We'll add a button after tracks container
  const downloadSection = document.createElement('div');
  downloadSection.style.marginTop = '20px';
  downloadSection.innerHTML = `<button class="btn primary" id="btnDownloadMix" data-i18n="btnDownloadMix">下載混合音訊</button>`;
  document.querySelector('main').appendChild(downloadSection);
  const btnDownloadMix = document.getElementById('btnDownloadMix');

  btnDownloadMix.addEventListener('click', async () => {
    if(tracks.length===0){
      alert(lang === 'zh' ? '沒有可下載的軌道' : 'No tracks to download');
      return;
    }
    // Render offline to capture mixed output
    const offlineCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(
      2, // stereo
      44100 * 30, // 30 seconds at 44.1kHz (enough for most short clips)
      44100
    );
    const mixer = offlineCtx.createGain();
    mixer.connect(offlineCtx.destination);
    tracks.forEach(t=>{
      const source = offlineCtx.createBufferSource();
      source.buffer = t.buffer;
      source.playbackRate.setValueAtTime(t.pitchSlider.value, offlineCtx.currentTime);
      const gain = offlineCtx.createGain();
      gain.gain.setValueAtTime(t.volumeSlider.value, offlineCtx.currentTime);
      source.connect(gain).connect(mixer);
      source.start(0, t.offset);
    });
    offlineCtx.startRendering();
    const renderedBuffer = await offlineCtx.renderingCompleted;
    // Convert to WAV blob (simple)
    function encodeWAV(samples, sampleRate){
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);
      // RIFF header
      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + samples.length * 2, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 2, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 4, true);
      view.setUint16(32, 4, true);
      view.setUint16(34, 16, true);
      writeString(view, 36, 'data');
      view.setUint32(40, samples.length * 2, true);
      // PCM samples
      floatTo16BitPCM(view, 44, samples);
      return buffer;
    }
    function writeString(view, offset, string){
      for(let i=0; i<string.length; i++){
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    }
    function floatTo16BitPCM(view, offset, input){
      for(let i=0; i<input.length; i++, offset+=2){
        let s = Math.max(-1, Math.min(1, input[i]));
        s = s < 0 ? s * 0x8000 : s * 0x7FFF;
        view.setInt16(offset, s, true);
      }
    }
    // Interleave left/right (we have mono buffer duplicated to stereo)
    const left = renderedBuffer.getChannelData(0);
    const right = renderedBuffer.getChannelData(1) || new Float32Array(left.length);
    const samples = new Float32Array(left.length * 2);
    for(let i=0; i<left.length; i++){
      samples[2*i] = left[i];
      samples[2*i+1] = right[i];
    }
    const wavBlob = new Blob([encodeWAV(samples, renderedBuffer.sampleRate)], {type: 'audio/wav'});
    const url = URL.createObjectURL(wavBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'mixed_output.wav';
    a.click();
    URL.revokeObjectURL(url);
  });

  // Initialize home button text
  SharedSettings.paintHomeLinks(SharedSettings.getLang());
})();
</script>

</body>
</html>
