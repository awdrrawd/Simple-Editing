<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON 格式化器 · 純瀏覽器工具</title>
<script src="../../assets/shared.js?v=20260907-2"></script>
<link rel="stylesheet" href="../../assets/shared.css">
<style>
  :root{ --radius:10px; }
  html[data-theme="light"]{
    --bg:#ffffff; --bg-inset:#f6f8fa; --bg-hover:#eef1f4;
    --border:#d0d7de; --text:#1f2328; --text-secondary:#656d76;
    --accent:#0969da; --accent-hover:#0860ca; --accent-soft:#ddf4ff; --accent-text:#ffffff;
    --shadow:0 1px 2px rgba(0,0,0,0.05);
  }
  html[data-theme="dark"]{
    --bg:#0d1117; --bg-inset:#161b22; --bg-hover:#21262d;
    --border:#30363d; --text:#e6edf3; --text-secondary:#8b949e;
    --accent:#58a6ff; --accent-hover:#79b8ff; --accent-soft:#132f4c; --accent-text:#0d1117;
    --shadow:0 1px 2px rgba(0,0,0,0.3);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Helvetica,Arial,sans-serif;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:14px 24px; flex-wrap:wrap;
    border-bottom:1px solid var(--border);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:32px; height:32px; border-radius:8px;
    background:var(--accent); color:var(--accent-text);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  }
  h1{ font-size:1.05rem; margin:0; }
  .btn{
    appearance:none; border:1px solid var(--border); background:var(--bg-inset);
    color:var(--text); border-radius:8px; padding:7px 12px; font-size:.82rem;
    font-weight:600; cursor:pointer; font-family:inherit;
  }
  .btn:hover{ background:var(--bg-hover); }
  .controls{ display:flex; gap:8px; }

  main{ max-width:960px; margin:0 auto; padding:40px 24px 64px; }
  .input-group{ margin-bottom:16px; }
  .input-group label{
    display:block; margin-bottom:6px; font-weight:600;
    color:var(--text-secondary);
  }
  .input-group textarea,
  .input-group select,
  .input-group .output{
    width:100%; border:1px solid var(--border);
    border-radius:var(--radius); padding:12px;
    background:var(--bg); color:var(--text);
    font-family:monospace;
    resize:vertical;
  }
  .input-group textarea{
    min-height:150px;
  }
  .input-group .output{
    background:var(--bg-inset); color:var(--text-secondary);
    min-height:150px; overflow-y:auto;
  }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .btn.primary{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  .btn.primary:hover{ background:var(--accent-hover); }
  .btn.ghost{ background:transparent; }
  .btn.success{ background:var(--accent); color:var(--accent-text); }
  .btn.danger{ background:#d5424e; color:#fff; border-color:#d5424e; }
  .btn.danger:hover{ background:#b6303c; }
  .hint{ font-size:.88rem; color:var(--text-secondary); margin-top:8px; }
  .status{ font-size:.9rem; font-weight:600; margin-top:8px; padding:4px 8px; border-radius:4px; display:inline-block; }
  .status.valid{ background:var(--bg-inset); color:var(--text); border:1px solid var(--border); }
  .status.invalid{ background:#fbe1e2; color:#ba2733; border:1px solid #fbe1e2; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">SE</div>
    <h1 data-i18n="toolTitle">JSON 格式化器</h1>
  </div>
  <div class="controls">
    <button class="btn" id="themeToggle" data-i18n="themeBtn">🌓 主題</button>
    <button class="btn" id="localeToggle" data-i18n="localeBtn">🌐 語系</button>
    <a href="../../index.html" class="btn" data-se-home></a>
  </div>
</div>

<main>
  <div class="input-group">
    <label for="jsonInput" data-i18n="labelJsonInput">輸入 JSON</label>
    <textarea id="jsonInput" placeholder="在此貼上或輸入 JSON 內容..." data-i18n="placeholderJson"></textarea>
  </div>
  <div class="input-group">
    <label for="jsonAction" data-i18n="labelJsonAction">操作</label>
    <select id="jsonAction">
      <option value="format" data-i18n="optionFormat">格式化 (美化)</option>
      <option value="compress" data-i18n="optionCompress">壓縮 (縮小)</option>
    </select>
  </div>
  <div class="btn-row">
    <button class="btn primary" id="btnProcess" data-i18n="btnProcess">處理</button>
    <button class="btn" id="btnCopy" data-i18n="btnCopy">複製結果</button>
    <button class="btn" id="btnValidate" data-i18n="btnValidate">驗證</button>
    <button class="btn" id="btnSample" data-i18n="btnSample">載入範例</button>
  </div>
  <div class="input-group">
    <label for="jsonOutput" data-i18n="labelJsonOutput">輸出結果</label>
    <textarea id="jsonOutput" readonly></textarea>
  </div>
  <div class="status" id="jsonStatus"></div>
  <p class="hint" id="hintJson" data-i18n="hintJson">支援標準 JSON 格式。格式化時會使用 2 空格縮排，壓縮時會移除所有不必要的空白。</p>
</main>

<script>
(function(){
  const root = document.documentElement;
  const I18N = {
    zh: {
      toolTitle:'JSON 格式化器 · 純瀏覽器工具',
      themeBtn:'🌓 主題', localeBtn:'🌐 語系',
      labelJsonInput:'輸入 JSON',
      labelJsonAction:'操作',
      optionFormat:'格式化 (美化)',
      optionCompress:'壓縮 (縮小)',
      btnProcess:'處理',
      btnCopy:'複製結果',
      btnValidate:'驗證',
      btnSample:'載入範例',
      placeholderJson:'在此貼上或輸入 JSON 內容...',
      labelJsonOutput:'輸出結果',
      hintJson:'支援標準 JSON 格式。格式化時會使用 2 空格縮排，壓縮時會移除所有不必要的空白。'
    },
    en: {
      toolTitle:'JSON Formatter · Browser-only tool',
      themeBtn:'🌓 Theme', localeBtn:'🌐 Language',
      labelJsonInput:'Input JSON',
      labelJsonAction:'Action',
      optionFormat:'Format (Beautify)',
      optionCompress:'Compress (Minify)',
      btnProcess:'Process',
      btnCopy:'Copy Result',
      btnValidate:'Validate',
      btnSample:'Load Sample',
      placeholderJson:'Paste or enter JSON here...',
      labelJsonOutput:'Output Result',
      hintJson:'Supports standard JSON format. Formatting uses 2-space indentation, compression removes all unnecessary whitespace.'
    }
  };

  let lang = SharedSettings.getLang();

  function applyLocale(){
    const dict = I18N[lang];
    root.setAttribute('lang', lang === 'zh' ? 'zh-Hant' : 'en');
    document.title = lang === 'zh' ? 'JSON 格式化器 · 純瀏覽器工具' : 'JSON Formatter · Browser-only tool';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      if(dict[key] !== undefined) {
        if (/^placeholder/i.test(key) && el.matches('textarea, input')) el.placeholder = dict[key];
        else el.textContent = dict[key];
      }
    });
  }
  applyLocale();
  document.getElementById('localeToggle').addEventListener('click', () => {
    lang = lang === 'zh' ? 'en' : 'zh';
    SharedSettings.setLang(lang);
    applyLocale();
  });

  // ---- theme ----
  let userOverride = SharedSettings.hasExplicitTheme();
  function applyTheme(theme){ root.setAttribute('data-theme', theme); }
  applyTheme(SharedSettings.getTheme());
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if(!userOverride) applyTheme(e.matches ? 'dark' : 'light');
  });
  document.getElementById('themeToggle').addEventListener('click', () => {
    userOverride = true;
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    SharedSettings.setTheme(next);
    applyTheme(next);
  });

  const jsonInput = document.getElementById('jsonInput');
  const jsonAction = document.getElementById('jsonAction');
  const btnProcess = document.getElementById('btnProcess');
  const btnCopy = document.getElementById('btnCopy');
  const btnValidate = document.getElementById('btnValidate');
  const btnSample = document.getElementById('btnSample');
  const jsonOutput = document.getElementById('jsonOutput');
  const jsonStatus = document.getElementById('jsonStatus');
  const hintJson = document.getElementById('hintJson');

  // Sample JSON
  const sampleJSON = {
    "name": "Simple Editing",
    "version": "1.0.0",
    "description": "A collection of single-page tools that run in the browser.",
    "tools": [
      {"name": "Markdown Editor", "icon": "📝"},
      {"name": "AI Cooldown", "icon": "⏱️"},
      {"name": "Image Editor", "icon": "🖼️"},
      {"name": "Base64 Converter", "icon": "🔤"},
      {"name": "Media Converter", "icon": "🎞️"},
      {"name": "Sharp Image Resize", "icon": "🔍"}
    ],
    "features": {
      "theme": ["light", "dark"],
      "language": ["zh-Hant", "en"],
      "storage": "localStorage (via shared.js)"
    }
  };

  btnSample.addEventListener('click', () => {
    jsonInput.value = JSON.stringify(sampleJSON, null, 2);
    jsonOutput.value = '';
    jsonStatus.textContent = '';
    jsonStatus.className = 'status';
    hintJson.textContent = lang === 'zh'
      ? '已載入範例 JSON。請選擇操作並點擊「處理」。'
      : 'Sample JSON loaded. Select an action and click "Process".';
  });

  btnValidate.addEventListener('click', () => {
    const text = jsonInput.value.trim();
    if (text === '') {
      jsonStatus.textContent = lang === 'zh' ? '請輸入 JSON 內容' : 'Please enter JSON content';
      jsonStatus.className = 'status invalid';
      return;
    }
    try {
      JSON.parse(text);
      jsonStatus.textContent = lang === 'zh' ? 'JSON 格式有效' : 'JSON is valid';
      jsonStatus.className = 'status valid';
    } catch (e) {
      jsonStatus.textContent = lang === 'zh' ? `JSON 格式無效：${e.message}` : `Invalid JSON: ${e.message}`;
      jsonStatus.className = 'status invalid';
    }
  });

  btnProcess.addEventListener('click', () => {
    const text = jsonInput.value.trim();
    if (text === '') {
      alert(lang === 'zh' ? '請輸入 JSON 內容' : 'Please enter JSON content');
      return;
    }
    try {
      const parsed = JSON.parse(text);
      let result;
      if (jsonAction.value === 'format') {
        result = JSON.stringify(parsed, null, 2);
      } else {
        result = JSON.stringify(parsed);
      }
      jsonOutput.value = result;
      jsonStatus.textContent = lang === 'zh'
        ? `處理完成！輸出長度：${result.length} 字元`
        : `Processing complete! Output length: ${result.length} characters`;
      jsonStatus.className = 'status valid';
      hintJson.textContent = lang === 'zh'
        ? `已${jsonAction.value === 'format' ? '格式化' : '壓縮'} JSON。`
        : `JSON has been ${jsonAction.value === 'format' ? 'formatted' : 'compressed'}.`;
    } catch (e) {
      alert(lang === 'zh' ? `JSON 解析失敗：${e.message}` : `JSON parsing failed: ${e.message}`);
      jsonOutput.value = '';
      jsonStatus.textContent = lang === 'zh' ? `處理失敗：${e.message}` : `Processing failed: ${e.message}`;
      jsonStatus.className = 'status invalid';
    }
  });

  btnCopy.addEventListener('click', () => {
    jsonOutput.select();
    document.execCommand('copy');
    alert(lang === 'zh' ? '已複製到剪貼簿' : 'Copied to clipboard');
  });

  // Initialize home button text
  SharedSettings.paintHomeLinks(SharedSettings.getLang());
})();
</script>

</body>
</html>
