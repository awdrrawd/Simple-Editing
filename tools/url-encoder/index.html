<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL 編碼 / 解碼 · 純瀏覽器工具</title>
<script src="../../assets/shared.js?v=20260907-2"></script>
<link rel="stylesheet" href="../../assets/shared.css">
<style>
  :root{ --radius:10px; }
  html[data-theme="light"]{
    --bg:#ffffff; --bg-inset:#f6f8fa; --bg-hover:#eef1f4;
    --border:#d0d7de; --text:#1f2328; --text-secondary:#656d76;
    --accent:#0969da; --accent-hover:#0860ca; --accent-soft:#ddf4ff; --accent-text:#ffffff;
    --shadow:0 1px 2px rgba(0,0,0,0.05);
  }
  html[data-theme="dark"]{
    --bg:#0d1117; --bg-inset:#161b22; --bg-hover:#21262d;
    --border:#30363d; --text:#e6edf3; --text-secondary:#8b949e;
    --accent:#58a6ff; --accent-hover:#79b8ff; --accent-soft:#132f4c; --accent-text:#0d1117;
    --shadow:0 1px 2px rgba(0,0,0,0.3);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Helvetica,Arial,sans-serif;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:14px 24px; flex-wrap:wrap;
    border-bottom:1px solid var(--border);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:32px; height:32px; border-radius:8px;
    background:var(--accent); color:var(--accent-text);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  }
  h1{ font-size:1.05rem; margin:0; }
  .btn{
    appearance:none; border:1px solid var(--border); background:var(--bg-inset);
    color:var(--text); border-radius:8px; padding:7px 12px; font-size:.82rem;
    font-weight:600; cursor:pointer; font-family:inherit;
  }
  .btn:hover{ background:var(--bg-hover); }
  .controls{ display:flex; gap:8px; }

  main{ max-width:960px; margin:0 auto; padding:40px 24px 64px; }
  .mode-container{
    border:1px solid var(--border); border-radius:var(--radius);
    background:var(--bg-inset); margin-bottom:24px;
  }
  .mode-list{
    display:flex; border-bottom:1px solid var(--border);
    background:var(--bg-inset);
  }
  .mode-list button{
    flex:1; appearance:none; border:none; background:transparent;
    color:var(--text-secondary); padding:12px 16px; font-size:.9rem;
    font-weight:600; cursor:pointer; position:relative;
  }
  .mode-list button.active{
    color:var(--text); border-bottom:3px solid var(--accent);
  }
  .mode-panel{ padding:24px; display:none; }
  .mode-panel.active{ display:block; }
  .input-group{ margin-bottom:16px; }
  .input-group label{
    display:block; margin-bottom:6px; font-weight:600;
    color:var(--text-secondary);
  }
  .input-group textarea,
  .input-group .output{
    width:100%; border:1px solid var(--border);
    border-radius:var(--radius); padding:12px;
    background:var(--bg); color:var(--text);
    font-family:monospace;
    resize:vertical;
  }
  .input-group textarea{
    min-height:120px;
  }
  .input-group .output{
    background:var(--bg-inset); color:var(--text-secondary);
    min-height:80px; overflow-y:auto;
  }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .btn.primary{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  .btn.primary:hover{ background:var(--accent-hover); }
  .btn.ghost{ background:transparent; }
  .hint{ font-size:.88rem; color:var(--text-secondary); margin-top:8px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">SE</div>
    <h1 data-i18n="toolTitle">URL 編碼 / 解碼</h1>
  </div>
  <div class="controls">
    <button class="btn" id="themeToggle" data-i18n="themeBtn">🌓 主題</button>
    <button class="btn" id="localeToggle" data-i18n="localeBtn">🌐 語系</button>
    <a href="../../index.html" class="btn" data-se-home></a>
  </div>
</div>

<main>
  <div class="mode-container">
    <div class="mode-list">
      <button class="mode-btn active" data-mode="encode" data-i18n="modeEncode">編碼 (URL Encode)</button>
      <button class="mode-btn" data-mode="decode" data-i18n="modeDecode">解碼 (URL Decode)</button>
    </div>
    <div class="mode-panel active" id="panel-encode">
      <div class="input-group">
        <label for="encodeInput" data-i18n="labelEncodeInput">輸入文字</label>
        <textarea id="encodeInput" placeholder="在此貼上要編碼的文字..." data-i18n="placeholderEncode"></textarea>
      </div>
      <div class="input-group">
        <label for="encodeOutput" data-i18n="labelEncodeOutput">編碼結果</label>
        <textarea id="encodeOutput" readonly></textarea>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="btnEncode" data-i18n="btnEncode">編碼</button>
        <button class="btn" id="btnEncodeCopy" data-i18n="btnCopy">複製結果</button>
      </div>
      <p class="hint" id="hintEncode" data-i18n="hintEncode">使用 encodeURIComponent 編碼，適合編碼查詢參數、路徑等。</p>
    </div>
    <div class="mode-panel" id="panel-decode">
      <div class="input-group">
        <label for="decodeInput" data-i18n="labelDecodeInput">輸入已編碼的文字</label>
        <textarea id="decodeInput" placeholder="在此貼上要解碼的文字..." data-i18n="placeholderDecode"></textarea>
      </div>
      <div class="input-group">
        <label for="decodeOutput" data-i18n="labelDecodeOutput">解碼結果</label>
        <textarea id="decodeOutput" readonly></textarea>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="btnDecode" data-i18n="btnDecode">解碼</button>
        <button class="btn" id="btnDecodeCopy" data-i18n="btnCopy">複製結果</button>
      </div>
      <p class="hint" id="hintDecode" data-i18n="hintDecode">使用 decodeURIComponent 解碼。若輸入不是有效的編碼字串，將顯示錯誤。</p>
    </div>
  </div>
</main>

<script>
(function(){
  const root = document.documentElement;
  const I18N = {
    zh: {
      toolTitle:'URL 編碼 / 解碼 · 純瀏覽器工具',
      themeBtn:'🌓 主題', localeBtn:'🌐 語系',
      modeEncode:'編碼 (URL Encode)',
      modeDecode:'解碼 (URL Decode)',
      labelEncodeInput:'輸入文字',
      labelEncodeOutput:'編碼結果',
      placeholderEncode:'在此貼上要編碼的文字...',
      btnEncode:'編碼',
      btnCopy:'複製結果',
      hintEncode:'使用 encodeURIComponent 編碼，適合編碼查詢參數、路徑等。',
      labelDecodeInput:'輸入已編碼的文字',
      labelDecodeOutput:'解碼結果',
      placeholderDecode:'在此貼上要解碼的文字...',
      btnDecode:'解碼',
      hintDecode:'使用 decodeURIComponent 解碼。若輸入不是有效的編碼字串，將顯示錯誤。'
    },
    en: {
      toolTitle:'URL Encoder / Decoder · Browser-only tool',
      themeBtn:'🌓 Theme', localeBtn:'🌐 Language',
      modeEncode:'Encode (URL Encode)',
      modeDecode:'Decode (URL Decode)',
      labelEncodeInput:'Input Text',
      labelEncodeOutput:'Encoded Result',
      placeholderEncode:'Paste text to encode here...',
      btnEncode:'Encode',
      btnCopy:'Copy Result',
      hintEncode:'Using encodeURIComponent, suitable for encoding query parameters, paths, etc.',
      labelDecodeInput:'Input Encoded Text',
      labelDecodeOutput:'Decoded Result',
      placeholderDecode:'Paste encoded text to decode here...',
      btnDecode:'Decode',
      hintDecode:'Using decodeURIComponent. If input is not a valid encoded string, an error will be shown.'
    }
  };

  let lang = SharedSettings.getLang();

  function applyLocale(){
    const dict = I18N[lang];
    root.setAttribute('lang', lang === 'zh' ? 'zh-Hant' : 'en');
    document.title = lang === 'zh' ? 'URL 編碼 / 解碼 · 純瀏覽器工具' : 'URL Encoder / Decoder · Browser-only tool';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      if(dict[key] !== undefined) {
        if (/^placeholder/i.test(key) && el.matches('textarea, input')) el.placeholder = dict[key];
        else el.textContent = dict[key];
      }
    });
  }
  applyLocale();
  document.getElementById('localeToggle').addEventListener('click', () => {
    lang = lang === 'zh' ? 'en' : 'zh';
    SharedSettings.setLang(lang);
    applyLocale();
  });

  // ---- theme ----
  let userOverride = SharedSettings.hasExplicitTheme();
  function applyTheme(theme){ root.setAttribute('data-theme', theme); }
  applyTheme(SharedSettings.getTheme());
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if(!userOverride) applyTheme(e.matches ? 'dark' : 'light');
  });
  document.getElementById('themeToggle').addEventListener('click', () => {
    userOverride = true;
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    SharedSettings.setTheme(next);
    applyTheme(next);
  });

  // Mode switching
  const modeButtons = document.querySelectorAll('.mode-btn');
  const modePanels = document.querySelectorAll('.mode-panel');
  modeButtons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      modeButtons.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const mode = btn.dataset.mode;
      modePanels.forEach(p=>p.classList.remove('active'));
      document.getElementById('panel-'+mode).classList.add('active');
    });
  });

  // Encode functionality
  const encodeInput = document.getElementById('encodeInput');
  const encodeOutput = document.getElementById('encodeOutput');
  const btnEncode = document.getElementById('btnEncode');
  const btnEncodeCopy = document.getElementById('btnEncodeCopy');
  const hintEncode = document.getElementById('hintEncode');

  btnEncode.addEventListener('click', () => {
    const text = encodeInput.value;
    if (text === '') {
      alert(lang === 'zh' ? '請輸入要編碼的文字' : 'Please enter text to encode');
      return;
    }
    const encoded = encodeURIComponent(text);
    encodeOutput.value = encoded;
    hintEncode.textContent = lang === 'zh'
      ? `編碼完成！長度：${encoded.length} 字元`
      : `Encoding complete! Length: ${encoded.length} characters`;
  });

  btnEncodeCopy.addEventListener('click', () => {
    encodeOutput.select();
    document.execCommand('copy');
    alert(lang === 'zh' ? '已複製到剪貼簿' : 'Copied to clipboard');
  });

  // Decode functionality
  const decodeInput = document.getElementById('decodeInput');
  const decodeOutput = document.getElementById('decodeOutput');
  const btnDecode = document.getElementById('btnDecode');
  const btnDecodeCopy = document.getElementById('btnDecodeCopy');
  const hintDecode = document.getElementById('hintDecode');

  btnDecode.addEventListener('click', () => {
    const text = decodeInput.value;
    if (text === '') {
      alert(lang === 'zh' ? '請輸入要解碼的文字' : 'Please enter text to decode');
      return;
    }
    try {
      const decoded = decodeURIComponent(text);
      decodeOutput.value = decoded;
      hintDecode.textContent = lang === 'zh'
        ? `解碼完成！長度：${decoded.length} 字元`
        : `Decoding complete! Length: ${decoded.length} characters`;
    } catch (e) {
      alert(lang === 'zh' ? `解碼失敗：${e.message}` : `Decoding failed: ${e.message}`);
      decodeOutput.value = '';
      hintDecode.textContent = lang === 'zh'
        ? `解碼失敗，請檢查輸入是否為有效的編碼字串`
        : `Decoding failed, please check input is a valid encoded string`;
    }
  });

  btnDecodeCopy.addEventListener('click', () => {
    decodeOutput.select();
    document.execCommand('copy');
    alert(lang === 'zh' ? '已複製到剪貼簿' : 'Copied to clipboard');
  });

  // Initialize home button text
  SharedSettings.paintHomeLinks(SharedSettings.getLang());
})();
</script>

</body>
</html>
