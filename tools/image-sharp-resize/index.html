<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>銳利圖片縮放 · 純瀏覽器工具</title>
<script src="../../assets/shared.js?v=20260907-2"></script>
<link rel="stylesheet" href="../../assets/shared.css">
<!-- Pica for high-quality image resizing -->
<script src="../../assets/vendor/pica.min.js"></script>
<style>
  :root{ --radius:10px; }
  html[data-theme="light"]{
    --bg:#ffffff; --bg-inset:#f6f8fa; --bg-hover:#eef1f4;
    --border:#d0d7de; --text:#1f2328; --text-secondary:#656d76;
    --accent:#0969da; --accent-hover:#0860ca; --accent-soft:#ddf4ff; --accent-text:#ffffff;
    --shadow:0 1px 2px rgba(0,0,0,0.05);
  }
  html[data-theme="dark"]{
    --bg:#0d1117; --bg-inset:#161b22; --bg-hover:#21262d;
    --border:#30363d; --text:#e6edf3; --text-secondary:#8b949e;
    --accent:#58a6ff; --accent-hover:#79b8ff; --accent-soft:#132f4c; --accent-text:#0d1117;
    --shadow:0 1px 2px rgba(0,0,0,0.3);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Helvetica,Arial,sans-serif;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:14px 24px; flex-wrap:wrap;
    border-bottom:1px solid var(--border);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:32px; height:32px; border-radius:8px;
    background:var(--accent); color:var(--accent-text);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  }
  h1{ font-size:1.05rem; margin:0; }
  .btn{
    appearance:none; border:1px solid var(--border); background:var(--bg-inset);
    color:var(--text); border-radius:8px; padding:7px 12px; font-size:.82rem;
    font-weight:600; cursor:pointer; font-family:inherit;
  }
  .btn:hover{ background:var(--bg-hover); }
  .controls{ display:flex; gap:8px; }

  main{ max-width:960px; margin:0 auto; padding:40px 24px 64px; }
  .input-group{ margin-bottom:16px; }
  .input-group label{
    display:block; margin-bottom:6px; font-weight:600;
    color:var(--text-secondary);
  }
  .input-group input[type=file],
  .input-group input[type=number],
  .input-group select,
  .input-group .output{
    width:100%; border:1px solid var(--border);
    border-radius:var(--radius); padding:12px;
    background:var(--bg); color:var(--text);
    font-family:monospace;
  }
  .input-group .output{
    background:var(--bg-inset); color:var(--text-secondary);
    min-height:200px; overflow-y:auto; text-align:center;
  }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .btn.primary{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  .btn.primary:hover{ background:var(--accent-hover); }
  .btn.ghost{ background:transparent; }
  .hint{ font-size:.88rem; color:var(--text-secondary); margin-top:8px; }
  .preview{ max-width:100%; max-height:400px; margin-top:12px; border-radius:4px; overflow:hidden; }
  .preview img{ width:100%; height:auto; display:block; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">SE</div>
    <h1 data-i18n="toolTitle">銳利圖片縮放</h1>
  </div>
  <div class="controls">
    <button class="btn" id="themeToggle" data-i18n="themeBtn">🌓 主題</button>
    <button class="btn" id="localeToggle" data-i18n="localeBtn">🌐 語系</button>
    <a href="../../index.html" class="btn" data-se-home></a>
  </div>
</div>

<main>
  <div class="input-group">
    <label for="imageInput" data-i18n="labelSelectImage">選取圖片檔案</label>
    <input type="file" id="imageInput" accept="image/*">
  </div>
  <div class="input-group">
    <label for="resizeMode" data-i18n="labelResizeMode">縮放演算法</label>
    <select id="resizeMode">
      <option value="lanczos3" data-se-zh="Lanczos 3 (高品質)" data-se-en="Lanczos 3 (high quality)">Lanczos 3 (高品質)</option>
      <option value="bilinear" data-se-zh="雙線性" data-se-en="Bilinear">雙線性</option>
      <option value="nearest" data-se-zh="最近鄰 (無平滑)" data-se-en="Nearest neighbor (no smoothing)">最近鄰 (無平滑)</option>
    </select>
  </div>
  <div class="input-group">
    <label for="width" data-i18n="labelWidth"><span data-se-zh="寬度 (px)" data-se-en="Width (px)">寬度 (px)</span></label>
    <input type="number" id="width" min="1" placeholder="例如 800">
  </div>
  <div class="input-group">
    <label for="height" data-i18n="labelHeight"><span data-se-zh="高度 (px)" data-se-en="Height (px)">高度 (px)</span></label>
    <input type="number" id="height" min="1" placeholder="例如 600">
  </div>
  <div class="input-group">
    <label for="scale" data-i18n="labelScale">或按比例縮放 (%)</label>
    <input type="number" id="scale" min="1" max="500" value="100" placeholder="例如 50">
    <div class="hint" data-i18n="hintScale">若寬高皆為空，則使用此比例；若同時填寫寬高，則以寬高為優先。</div>
  </div>
  <div class="btn-row">
    <button class="btn primary" id="btnResize" data-i18n="btnResize">進行縮放</button>
    <button class="btn" id="btnDownload" data-i18n="btnDownload">下載結果</button>
  </div>
  <div class="output" id="imageOutput"></div>
  <p class="hint" id="hintResize" data-i18n="hintResize">支援 PNG、JPEG、WebP、GIF 等格式。使用 Lanczos 3 演算法可在縮小時保留銳利度與細節。</p>
</main>

<script>
(function(){
  const root = document.documentElement;
  const I18N = {
    zh: {
      toolTitle:'銳利圖片縮放 · 純瀏覽器工具',
      themeBtn:'🌓 主題', localeBtn:'🌐 語系',
      labelSelectImage:'選取圖片檔案',
      labelResizeMode:'縮放演算法',
      labelWidth:'寬度 (px)',
      labelHeight:'高度 (px)',
      labelScale:'或按比例縮放 (%)',
      hintScale:'若寬高皆為空，則使用此比例；若同時填寫寬高，則以寬高為優先。',
      btnResize:'進行縮放',
      btnDownload:'下載結果',
      hintResize:'支援 PNG、JPEG、WebP、GIF 等格式。使用 Lanczos 3 演算法可在縮小時保留銳利度與細節。'
    },
    en: {
      toolTitle:'Sharp Image Resize · Browser-only tool',
      themeBtn:'🌓 Theme', localeBtn:'🌐 Language',
      labelSelectImage:'Select Image File',
      labelResizeMode:'Resize Algorithm',
      labelWidth:'Width (px)',
      labelHeight:'Height (px)',
      labelScale:'Or scale by percentage (%)',
      hintScale:'If width and height are empty, this scale is used; if both width and height are filled, they take precedence.',
      btnResize:'Resize',
      btnDownload:'Download Result',
      hintResize:'Supports PNG, JPEG, WebP, GIF, etc. Lanczos 3 algorithm preserves sharpness and detail when downscaling.'
    }
  };

  let lang = SharedSettings.getLang();

  function applyLocale(){
    const dict = I18N[lang];
    root.setAttribute('lang', lang === 'zh' ? 'zh-Hant' : 'en');
    document.title = lang === 'zh' ? '銳利圖片縮放 · 純瀏覽器工具' : 'Sharp Image Resize · Browser-only tool';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      if(dict[key] !== undefined) {
        if (/^placeholder/i.test(key) && el.matches('textarea, input')) el.placeholder = dict[key];
        else el.textContent = dict[key];
      }
    });
  }
  applyLocale();
  document.getElementById('localeToggle').addEventListener('click', () => {
    lang = lang === 'zh' ? 'en' : 'zh';
    SharedSettings.setLang(lang);
    applyLocale();
  });

  // ---- theme ----
  let userOverride = SharedSettings.hasExplicitTheme();
  function applyTheme(theme){ root.setAttribute('data-theme', theme); }
  applyTheme(SharedSettings.getTheme());
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if(!userOverride) applyTheme(e.matches ? 'dark' : 'light');
  });
  document.getElementById('themeToggle').addEventListener('click', () => {
    userOverride = true;
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    SharedSettings.setTheme(next);
    applyTheme(next);
  });

  const imageInput = document.getElementById('imageInput');
  const resizeMode = document.getElementById('resizeMode');
  const widthInput = document.getElementById('width');
  const heightInput = document.getElementById('height');
  const scaleInput = document.getElementById('scale');
  const btnResize = document.getElementById('btnResize');
  const btnDownload = document.getElementById('btnDownload');
  const imageOutput = document.getElementById('imageOutput');
  const hintResize = document.getElementById('hintResize');

  let resultUrl;
  window.addEventListener('pagehide', () => { if (resultUrl) URL.revokeObjectURL(resultUrl); });
  btnResize.addEventListener('click', async () => {
    const file = imageInput.files[0];
    if (!file) {
      alert(lang === 'zh' ? '請先選取一張圖片' : 'Please select an image first');
      return;
    }
    const img = new Image();
    const sourceUrl = URL.createObjectURL(file);
    btnResize.disabled = true;
    img.onload = async () => {
      try {
      let targetWidth = parseInt(widthInput.value);
      let targetHeight = parseInt(heightInput.value);
      const scalePercent = parseInt(scaleInput.value);
      const isWidthHeightSet = !isNaN(targetWidth) && !isNaN(targetHeight);
      let finalWidth, finalHeight;

      if (isWidthHeightSet) {
        finalWidth = targetWidth;
        finalHeight = targetHeight;
      } else if (!isNaN(scalePercent) && scalePercent > 0) {
        finalWidth = Math.round(img.width * scalePercent / 100);
        finalHeight = Math.round(img.height * scalePercent / 100);
      } else {
        alert(lang === 'zh' ? '請填寫寬高或比例' : 'Please enter width/height or scale percentage');
        return;
      }

      // Ensure positive dimensions
      if (finalWidth <= 0 || finalHeight <= 0) {
        alert(lang === 'zh' ? '寬高必須為正數' : 'Width and height must be positive numbers');
        return;
      }

      // Create offscreen canvas
      const offscreen = document.createElement('canvas');
      offscreen.width = finalWidth; offscreen.height = finalHeight;
      const ctx = offscreen.getContext('2d');

      // Choose algorithm
      const mode = resizeMode.value;
      if (mode === 'lanczos3') {
        // Use Pica for Lanczos resize
        await new Promise((resolve, reject) => {
          pica()
            .resize(img, offscreen, {
              filter: 'lanczos3',
              unsharpAmount: 80,   // sharpening amount
              unsharpRadius: 0.6,  // radius
              unsharpThreshold: 2  // threshold
            })
            .then(resolve)
            .catch(reject);
        });
      } else if (mode === 'bilinear') {
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, finalWidth, finalHeight);
      } else if (mode === 'nearest') {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(img, 0, 0, finalWidth, finalHeight);
      }

      // Convert to blob and show preview
      const blob = await new Promise(resolve => offscreen.toBlob(resolve, ['image/png','image/jpeg','image/webp'].includes(file.type) ? file.type : 'image/png'));
      if (!blob) throw new Error('Image export failed');
      {
        if (resultUrl) URL.revokeObjectURL(resultUrl);
        const url = resultUrl = URL.createObjectURL(blob);
        imageOutput.innerHTML = `<div class="preview"><img src="${url}" alt="Resized image"></div>`;
        btnDownload.onclick = () => {
          const a = document.createElement('a');
          a.href = url;
          // Preserve original filename with suffix
          const name = file.name.replace(/\.[^.]+$/, '');
          const ext = { 'image/png': '.png', 'image/jpeg': '.jpg', 'image/webp': '.webp' }[blob.type] || '.png';
          a.download = `${name}_resized${ext}`;
          a.click();

        };
        btnDownload.style.display = 'inline-block';
        hintResize.textContent = lang === 'zh'
          ? `縮放完成！${img.width}×${img.height} → ${finalWidth}×${finalHeight}`
          : `Resize complete! ${img.width}×${img.height} → ${finalWidth}×${finalHeight}`;
      }
      } catch (err) {
        console.error(err);
        alert(lang === 'zh' ? '產生結果時發生錯誤' : 'Error generating result');
      } finally { URL.revokeObjectURL(sourceUrl); btnResize.disabled = false; }
    };
    img.onerror = () => {
      URL.revokeObjectURL(sourceUrl); btnResize.disabled = false;
      alert(lang === 'zh' ? '無法讀取圖片檔案' : 'Unable to read image file');
    };
    img.src = sourceUrl;
  });

  // Initialize home button text
  SharedSettings.paintHomeLinks(SharedSettings.getLang());
})();
</script>

</body>
</html>
