<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base64 · 純瀏覽器工具</title>
<script src="../../assets/shared.js?v=20260907-2"></script>
<link rel="stylesheet" href="../../assets/shared.css">
<style>
  :root{ --radius:10px; }
  html[data-theme="light"]{
    --bg:#ffffff; --bg-inset:#f6f8fa; --bg-hover:#eef1f4;
    --border:#d0d7de; --text:#1f2328; --text-secondary:#656d76;
    --accent:#0969da; --accent-hover:#0860ca; --accent-soft:#ddf4ff; --accent-text:#ffffff;
    --shadow:0 1px 2px rgba(0,0,0,0.05);
  }
  html[data-theme="dark"]{
    --bg:#0d1117; --bg-inset:#161b22; --bg-hover:#21262d;
    --border:#30363d; --text:#e6edf3; --text-secondary:#8b949e;
    --accent:#58a6ff; --accent-hover:#79b8ff; --accent-soft:#132f4c; --accent-text:#0d1117;
    --shadow:0 1px 2px rgba(0,0,0,0.3);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Helvetica,Arial,sans-serif;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:14px 24px; flex-wrap:wrap;
    border-bottom:1px solid var(--border);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:32px; height:32px; border-radius:8px;
    background:var(--accent); color:var(--accent-text);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  }
  h1{ font-size:1.05rem; margin:0; }
  .btn{
    appearance:none; border:1px solid var(--border); background:var(--bg-inset);
    color:var(--text); border-radius:8px; padding:7px 12px; font-size:.82rem;
    font-weight:600; cursor:pointer; font-family:inherit;
  }
  .btn:hover{ background:var(--bg-hover); }
  .controls{ display:flex; gap:8px; }

  main{ max-width:960px; margin:0 auto; padding:40px 24px 64px; }
  .mode-container{
    border:1px solid var(--border); border-radius:var(--radius);
    background:var(--bg-inset); margin-bottom:24px;
  }
  .mode-list{
    display:flex; border-bottom:1px solid var(--border);
    background:var(--bg-inset);
  }
  .mode-list button{
    flex:1; appearance:none; border:none; background:transparent;
    color:var(--text-secondary); padding:12px 16px; font-size:.9rem;
    font-weight:600; cursor:pointer; position:relative;
  }
  .mode-list button.active{
    color:var(--text); border-bottom:3px solid var(--accent);
  }
  .mode-panel{ padding:24px; display:none; }
  .mode-panel.active{ display:block; }
  .input-group{ margin-bottom:16px; }
  .input-group label{
    display:block; margin-bottom:6px; font-weight:600;
    color:var(--text-secondary);
  }
  .input-group input[type=file],
  .input-group textarea,
  .input-group .output,
  .input-group select{
    width:100%; border:1px solid var(--border);
    border-radius:var(--radius); padding:12px;
    background:var(--bg); color:var(--text);
    font-family:monospace;
  }
  .input-group textarea{
    min-height:120px;
    resize:vertical;
  }
  .input-group .output{
    background:var(--bg-inset); color:var(--text-secondary);
    min-height:80px; overflow-y:auto;
    text-align:center;
  }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .btn.primary{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  .btn.primary:hover{ background:var(--accent-hover); }
  .btn.ghost{ background:transparent; }
  .hint{ font-size:.88rem; color:var(--text-secondary); margin-top:8px; }
  .file-info{ font-size:.88rem; color:var(--text-secondary); margin-top:4px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">SE</div>
    <h1 data-i18n="toolTitle">Base64</h1>
  </div>
  <div class="controls">
    <button class="btn" id="themeToggle" data-i18n="themeBtn">🌓 主題</button>
    <button class="btn" id="localeToggle" data-i18n="localeBtn">🌐 語系</button>
    <a href="../../index.html" class="btn" data-se-home></a>
  </div>
</div>

<main>
  <div class="mode-container">
    <div class="mode-list">
      <button class="mode-btn active" data-mode="encode" data-i18n="modeEncode">編碼 (→ Base64)</button>
      <button class="mode-btn" data-mode="decode" data-i18n="modeDecode">解碼 (Base64 →)</button>
    </div>
    <div class="mode-panel active" id="panel-encode">
      <div class="input-group">
        <label id="encodeInputLabel" for="encodeTextInput" data-i18n="labelEncodeInput">選擇檔案或貼上文字</label>
        <div>
          <input type="file" id="encodeFileInput" aria-labelledby="encodeInputLabel">
          <div class="hint" data-i18n="hintOrText">或直接貼上文字內容</div>
          <textarea id="encodeTextInput" placeholder="在此貼上要編碼的文字..." data-i18n="placeholderText"></textarea>
        </div>
      </div>
      <div class="input-group">
        <label for="encodeOutput" data-i18n="labelEncodeOutput">Base64 結果</label>
        <textarea id="encodeOutput" readonly></textarea>
      </div>
      <div class="file-info" id="encodeFileInfo"></div>
      <div class="btn-row">
        <button class="btn primary" id="btnEncode" data-i18n="btnEncode">編碼為 Base64</button>
        <button class="btn" id="btnEncodeCopy" data-i18n="btnCopy">複製結果</button>
      </div>
      <p class="hint" id="hintEncode" data-i18n="hintEncode">支援任何檔案類型。編碼後會產出標準的 Base64 字串（不含 data:URL 前綴）。</p>
    </div>
    <div class="mode-panel" id="panel-decode">
      <div class="input-group">
        <label for="decodeInput" data-i18n="labelDecodeInput">貼上 Base64 字串</label>
        <textarea id="decodeInput" rows="3" placeholder="在此貼上要解碼的 Base64 字串..." data-i18n="placeholderBase64"></textarea>
      </div>
      <div class="input-group">
        <label for="decodeOutputType" data-i18n="labelOutputType">輸出類型</label>
        <select id="decodeOutputType">
          <option value="text">純文字</option>
          <option value="file">下載檔案</option>
        </select>
      </div>
      <div class="input-group" id="decodeFileNameGroup" style="display:none;">
        <label for="decodeFileName" data-i18n="labelFileName">檔案名稱 (含副檔名)</label>
        <input type="text" id="decodeFileName" placeholder="例如：output.txt">
      </div>
      <div class="input-group">
        <label for="decodeOutput" data-i18n="labelDecodeOutput">解碼結果</label>
        <div id="decodeOutput"></div>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="btnDecode" data-i18n="btnDecode">解碼</button>
        <a class="btn" id="btnDecodeDownload" data-i18n="btnDownload" style="display:none">下載結果</a>
      </div>
      <p class="hint" id="hintDecode" data-i18n="hintDecode">支援標準 Base64 解碼。若選擇「下載檔案」，請先指定檔案名稱。</p>
    </div>
  </div>
</main>

<script>
(function(){
  const root = document.documentElement;
  const I18N = {
    zh: {
      toolTitle:'Base64 · 純瀏覽器工具',
      themeBtn:'🌓 主題', localeBtn:'🌐 語系',
      modeEncode:'編碼 (→ Base64)',
      modeDecode:'解碼 (Base64 →)',
      labelEncodeInput:'選擇檔案或貼上文字',
      labelEncodeOutput:'Base64 結果',
      hintOrText:'或直接貼上文字內容',
      placeholderText:'在此貼上要編碼的文字...',
      btnEncode:'編碼為 Base64',
      btnCopy:'複製結果',
      hintEncode:'支援任何檔案類型。編碼後會產出標準的 Base64 字串（不含 data:URL 前綴）。',
      labelDecodeInput:'貼上 Base64 字串',
      labelOutputType:'輸出類型',
      labelFileName:'檔案名稱 (含副檔名)',
      placeholderBase64:'在此貼上要解碼的 Base64 字串...',
      labelDecodeOutput:'解碼結果',
      btnDecode:'解碼',
      btnDownload:'下載結果',
      hintDecode:'支援標準 Base64 解碼。若選擇「下載檔案」，請先指定檔案名稱。'
    },
    en: {
      toolTitle:'Base64 · Browser-only tool',
      themeBtn:'🌓 Theme', localeBtn:'🌐 Language',
      modeEncode:'Encode (→ Base64)',
      modeDecode:'Decode (Base64 →)',
      labelEncodeInput:'Select file or paste text',
      labelEncodeOutput:'Base64 Result',
      hintOrText:'or paste text directly',
      placeholderText:'Paste text to encode here...',
      btnEncode:'Encode to Base64',
      btnCopy:'Copy result',
      hintEncode:'Supports any file type. Output is standard Base64 string (no data:URL prefix).',
      labelDecodeInput:'Paste Base64 string',
      labelOutputType:'Output Type',
      labelFileName:'Filename (with extension)',
      placeholderBase64:'Paste Base64 string to decode here...',
      labelDecodeOutput:'Decoded Result',
      btnDecode:'Decode',
      btnDownload:'Download Result',
      hintDecode:'Supports standard Base64 decoding. If selecting "Download File", please specify filename first.'
    }
  };

  let lang = SharedSettings.getLang();

  function applyLocale(){
    const dict = I18N[lang];
    root.setAttribute('lang', lang === 'zh' ? 'zh-Hant' : 'en');
    document.title = lang === 'zh' ? 'Base64 · 純瀏覽器工具' : 'Base64 · Browser-only tool';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      if(dict[key] !== undefined) {
        if (/^placeholder/i.test(key) && el.matches('textarea, input')) el.placeholder = dict[key];
        else el.textContent = dict[key];
      }
    });
  }
  applyLocale();
  document.getElementById('localeToggle').addEventListener('click', () => {
    lang = lang === 'zh' ? 'en' : 'zh';
    SharedSettings.setLang(lang);
    applyLocale();
  });

  // ---- theme ----
  let userOverride = SharedSettings.hasExplicitTheme();
  function applyTheme(theme){ root.setAttribute('data-theme', theme); }
  applyTheme(SharedSettings.getTheme());
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if(!userOverride) applyTheme(e.matches ? 'dark' : 'light');
  });
  document.getElementById('themeToggle').addEventListener('click', () => {
    userOverride = true;
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    SharedSettings.setTheme(next);
    applyTheme(next);
  });

  // Mode switching
  const modeButtons = document.querySelectorAll('.mode-btn');
  const modePanels = document.querySelectorAll('.mode-panel');
  modeButtons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      modeButtons.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const mode = btn.dataset.mode;
      modePanels.forEach(p=>p.classList.remove('active'));
      document.getElementById('panel-'+mode).classList.add('active');
      // Toggle filename visibility for decode mode
      const fileNameGroup = document.getElementById('decodeFileNameGroup');
      if (mode === 'decode') {
        fileNameGroup.style.display = document.getElementById('decodeOutputType').value === 'file' ? 'block' : 'none';
      } else {
        fileNameGroup.style.display = 'none';
      }
    });
  });

  // Encode functionality
  const encodeFileInput = document.getElementById('encodeFileInput');
  const encodeTextInput = document.getElementById('encodeTextInput');
  const encodeOutput = document.getElementById('encodeOutput');
  const btnEncode = document.getElementById('btnEncode');
  const btnEncodeCopy = document.getElementById('btnEncodeCopy');
  const encodeFileInfo = document.getElementById('encodeFileInfo');
  const hintEncode = document.getElementById('hintEncode');

  btnEncode.addEventListener('click', () => {
    let dataToEncode = '';
    let sourceName = '';

    // Check if file is selected
    if (encodeFileInput.files.length > 0) {
      const file = encodeFileInput.files[0];
      sourceName = file.name;
      const reader = new FileReader();
      reader.onload = function(e) {
        const base64 = SharedSettings.bytesToBase64(new Uint8Array(e.target.result));
        encodeOutput.value = base64;
        encodeFileInfo.textContent = lang === 'zh'
          ? `已編碼：${sourceName} (${Math.floor(file.size/1024)} KB)`
          : `Encoded: ${sourceName} (${Math.floor(file.size/1024)} KB)`;
        hintEncode.textContent = lang === 'zh'
          ? `編碼完成！大小：${Math.floor(base64.length * 3 / 4 / 1024)} KB`
          : `Encoding complete! Size: ${Math.floor(base64.length * 3 / 4 / 1024)} KB`;
      };
      reader.onerror = function() {
        alert(lang === 'zh' ? '讀取檔案時發生錯誤' : 'Error reading file');
      };
      reader.readAsArrayBuffer(file);
      return; // Will handle in onload
    }
    // Otherwise use text input
    else if (encodeTextInput.value.trim() !== '') {
      dataToEncode = encodeTextInput.value;
      sourceName = 'text input';
      try {
        const base64 = SharedSettings.bytesToBase64(new TextEncoder().encode(encodeTextInput.value));
        encodeOutput.value = base64;
        encodeFileInfo.textContent = lang === 'zh'
          ? `已編碼：純文字 (${encodeTextInput.value.length} 字元)`
          : `Encoded: plain text (${encodeTextInput.value.length} characters)`;
        hintEncode.textContent = lang === 'zh'
          ? `編碼完成！Base64 長度：${base64.length} 個字元`
          : `Encoding complete! Base64 length: ${base64.length} characters`;
      } catch (e) {
        alert(lang === 'zh' ? '編碼失敗' : 'Encoding failed');
      }
    } else {
      alert(lang === 'zh' ? '請選擇檔案或輸入文字' : 'Please select a file or enter text');
      return;
    }
  });

  btnEncodeCopy.addEventListener('click', () => {
    encodeOutput.select();
    document.execCommand('copy');
    alert(lang === 'zh' ? '已複製到剪貼簿' : 'Copied to clipboard');
  });

  // Decode functionality
  const decodeInput = document.getElementById('decodeInput');
  const decodeOutputType = document.getElementById('decodeOutputType');
  const decodeFileName = document.getElementById('decodeFileName');
  const decodeOutput = document.getElementById('decodeOutput');
  const btnDecode = document.getElementById('btnDecode');
  const btnDecodeDownload = document.getElementById('btnDecodeDownload');
  const decodeFileNameGroup = document.getElementById('decodeFileNameGroup');
  const hintDecode = document.getElementById('hintDecode');

  // Show/hide filename input based on output type
  decodeOutputType.addEventListener('change', () => {
    decodeFileNameGroup.style.display = decodeOutputType.value === 'file' ? 'block' : 'none';
    if (decodeOutputType.value === 'file') {
      decodeFileName.focus();
    }
  });

  btnDecode.addEventListener('click', () => {
    const b64 = decodeInput.value.trim();
    if (!b64) {
      alert(lang === 'zh' ? '請貼上 Base64 字串' : 'Please paste a Base64 string');
      return;
    }

    // Clean up potential whitespace and newlines
    const cleanB64 = b64.replace(/\s/g, '');

    try {
      // Decode base64
      const binaryString = atob(cleanB64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      if (decodeOutputType.value === 'text') {
        // Try to decode as UTF-8 text
        let textOutput = '';
        try {
          textOutput = new TextDecoder('utf-8', {fatal:true}).decode(bytes);
        } catch (e) {
          // If not valid UTF-8, show as hex or warn
          textOutput = `[Binary data: ${bytes.length} bytes]`;
        }
        decodeOutput.replaceChildren();
        const pre = document.createElement('pre');
        pre.textContent = textOutput;
        decodeOutput.appendChild(pre);
        btnDecodeDownload.style.display = 'none';
        hintDecode.textContent = lang === 'zh'
          ? `解碼完成！${bytes.length} 位元組已轉換為文字`
          : `Decoding complete! ${bytes.length} bytes converted to text`;
      } else {
        // File download mode
        const fileName = decodeFileName.value.trim() || 'decoded.bin';
        const blob = new Blob([bytes]);
        if (btnDecodeDownload.href) URL.revokeObjectURL(btnDecodeDownload.href);
        const url = URL.createObjectURL(blob);

        decodeOutput.innerHTML = `<p>${lang === 'zh' ? '準備下載檔案' : 'Ready to download file'}</p>`;
        btnDecodeDownload.href = url;
        btnDecodeDownload.download = fileName;
        btnDecodeDownload.style.display = 'inline-block';
        hintDecode.textContent = lang === 'zh'
          ? `解碼完成！點擊下載按鈕以下載 ${fileName}`
          : `Decoding complete! Click download button to save ${fileName}`;
      }
    } catch (e) {
      console.error(e);
      alert(lang === 'zh' ? 'Base64 解碼失敗，請檢查字串是否正確' : 'Base64 decoding failed. Please check the string');
      decodeOutput.innerHTML = '';
      btnDecodeDownload.style.display = 'none';
    }
  });

  btnDecodeDownload.addEventListener('click', function(e) {
    // Actually trigger the download link
    if (this.href && this.download) {
      // Link is already set in btnDecode click handler
      return true;
    }
    e.preventDefault();
  });

  // Initialize home button text
  SharedSettings.paintHomeLinks(SharedSettings.getLang());
})();
</script>

</body>
</html>
